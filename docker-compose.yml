# OpenTAKServer – Adapted for Portainer CE
#
# Key difference from the upstream version: NO bind mounts are used.
# Portainer CE does not resolve relative paths from a Git repository to the Docker host,
# while absolute paths would require manual preparation of the host system.
# Instead, this setup uses the following approach:
# - All persistent data is stored in Docker named volumes.
# - All configuration files are copied directly into the images using lightweight Dockerfiles.
# - Build contexts are uploaded to the Docker daemon, ensuring compatibility even when the host cannot directly access the repository directory.
# For available configuration variables, see .env.example.

x-ots-env: &ots-env
  SQLALCHEMY_DATABASE_URI: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@ots-db/${POSTGRES_DB}"
  OTS_FQDN: "${OTS_FQDN}"
  OTS_RABBITMQ_SERVER_ADDRESS: "rabbitmq"
  OTS_LISTENER_ADDRESS: "0.0.0.0"
  OTS_MEDIAMTX_API_ADDRESS: "http://mediamtx:9997"

services:
  # ---------------------------------------------------------------
  # One-time initialization: Generates a DEDICATED Certificate Authority (CA) inside the volume.
  # ---------------------------------------------------------------
  ots-init:
    image: ghcr.io/brian7704/opentakserver:${OTS_TAG}
    container_name: ots-init
    environment: *ots-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /app/ots/uploads /app/ots/logs /app/ots/mediamtx/recordings
        if [ ! -f /app/ots/ca/.ots-ca-generated ]; then
          echo "Generating a dedicated CA for OpenTAKServer..."
          rm -rf /app/ots/ca
          mkdir -p /app/ots/ca
          APP=$$(ls /app/venv/lib/python3*/site-packages/opentakserver/app.py | head -1)
          /app/venv/bin/flask --app "$$APP" ots create-ca
          touch /app/ots/ca/.ots-ca-generated
          echo "CA generated."
        else
          echo "CA already exists, nothing to do."
        fi
    volumes:
      - "ots-data:/app/ots"
    depends_on:
      ots-db:
        condition: service_healthy
    restart: "no"
    networks: [ots]

  ots:
    image: ghcr.io/brian7704/opentakserver:${OTS_TAG}
    container_name: opentakserver
    hostname: opentakserver
    restart: unless-stopped
    tty: true
    environment: *ots-env
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - "ots-data:/app/ots"
    depends_on:
      ots-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: curl --fail http://localhost:8081/api/health || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks: [ots]

  ots_cot_parser:
    image: ghcr.io/brian7704/ots_cot_parser:${OTS_TAG}
    container_name: ots_cot_parser
    hostname: ots_cot_parser
    restart: unless-stopped
    tty: true
    command: python3 /app/venv/bin/cot_parser
    environment: *ots-env
    healthcheck:
      disable: true
    volumes:
      - "ots-data:/app/ots"
    depends_on:
      ots:
        condition: service_healthy
    networks: [ots]

  ots_eud_handler:
    image: ghcr.io/brian7704/ots_eud_handler:${OTS_TAG}
    container_name: ots_eud_handler
    hostname: ots_eud_handler
    restart: unless-stopped
    tty: true
    command: python3 /app/venv/bin/eud_handler
    environment: *ots-env
    ports:
      - "0.0.0.0:8088:8088"
    healthcheck:
      disable: true
    volumes:
      - "ots-data:/app/ots"
    depends_on:
      ots:
        condition: service_healthy
    networks: [ots]

  ots_eud_handler_ssl:
    image: ghcr.io/brian7704/ots_eud_handler_ssl:${OTS_TAG}
    container_name: ots_eud_handler_ssl
    hostname: ots_eud_handler_ssl
    restart: unless-stopped
    tty: true
    command: python3 /app/venv/bin/eud_handler --ssl
    environment: *ots-env
    ports:
      - "0.0.0.0:8089:8089"
    healthcheck:
      disable: true
    volumes:
      - "ots-data:/app/ots"
    depends_on:
      ots:
        condition: service_healthy
    networks: [ots]

  ots-webui:
    image: ghcr.io/brian7704/opentakserver-ui:${OTS_TAG}
    container_name: opentakserver-webui
    hostname: opentakserver-webui
    restart: unless-stopped
    healthcheck:
      disable: true
    networks: [ots]

  nginx-proxy:
    build:
      context: .
      dockerfile: ots/configs/nginx/Dockerfile.proxy
    image: ots-nginx-proxy:local
    pull_policy: build
    container_name: ots-nginx-proxy
    hostname: nginx-proxy
    restart: unless-stopped
    environment:
      OTS_FQDN: "${OTS_FQDN}"
      OTS_WEBUI_ADDRESS: "opentakserver-webui"
      OTS_ADDRESS: "opentakserver:8081"
      MTX_ADDRESS: "mediamtx"
      CLIENT_MAX_BODY_SIZE: "512M"
    expose:
      - "80"
      - "8080"
      - "8443"
      - "8446"
    volumes:
      - "ots-data:/app/ots:ro"   # Nginx loads the CA certificates from /app/ots/ca.
    depends_on:
      ots:
        condition: service_healthy
    networks: [ots, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-traefik}"

      # ---------------------------------------------------------------
      # WebUI / API - HTTP (entrypoint :80), redirects to HTTPS
      # ---------------------------------------------------------------
      traefik.http.routers.ots-web.rule: "Host(`${OTS_FQDN}`)"
      traefik.http.routers.ots-web.entrypoints: "${TRAEFIK_WEB_ENTRYPOINT:-web}"
      traefik.http.routers.ots-web.service: "ots-webui"
      traefik.http.routers.ots-web.middlewares: "ots-https-redirect"
      traefik.http.middlewares.ots-https-redirect.redirectscheme.scheme: "https"
      traefik.http.middlewares.ots-https-redirect.redirectscheme.permanent: "true"

      # ---------------------------------------------------------------
      # WebUI / API - HTTPS (entrypoint :443), TLS terminated by Traefik
      # ---------------------------------------------------------------
      traefik.http.routers.ots-websecure.rule: "Host(`${OTS_FQDN}`)"
      traefik.http.routers.ots-websecure.entrypoints: "${TRAEFIK_WEBSECURE_ENTRYPOINT:-websecure}"
      traefik.http.routers.ots-websecure.service: "ots-webui"
      traefik.http.routers.ots-websecure.tls: "true"
      traefik.http.routers.ots-websecure.tls.certresolver: "${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      traefik.http.services.ots-webui.loadbalancer.server.port: "80"

      # ---------------------------------------------------------------
      # Marti API - HTTP (dedicated Traefik entrypoint on :8080)
      # ---------------------------------------------------------------
      traefik.http.routers.ots-marti.rule: "Host(`${OTS_FQDN}`)"
      traefik.http.routers.ots-marti.entrypoints: "${TRAEFIK_MARTI_ENTRYPOINT:-takapi}"
      traefik.http.routers.ots-marti.service: "ots-marti"
      traefik.http.services.ots-marti.loadbalancer.server.port: "8080"

      # ---------------------------------------------------------------
      # Marti API - mTLS (dedicated Traefik entrypoint on :8443)
      #
      # This service requires a client certificate issued by the OTS CA.
      # Therefore TLS is NOT terminated by Traefik: a TCP router with
      # passthrough forwards the raw TLS stream to nginx, which keeps doing
      # the server certificate and the "ssl_verify_client on" check exactly
      # as before. Traefik only picks the route based on the SNI.
      #
      # NOTE: SNI routing requires clients to connect via the hostname.
      # If OTS_FQDN is an IP address (or clients send no SNI), change the
      # rule below to HostSNI(`*`) - that is safe here because :8443 is a
      # dedicated entrypoint used by OpenTAKServer only.
      # ---------------------------------------------------------------
      traefik.tcp.routers.ots-marti-mtls.rule: "HostSNI(`${OTS_FQDN}`)"
      traefik.tcp.routers.ots-marti-mtls.entrypoints: "${TRAEFIK_MARTI_TLS_ENTRYPOINT:-takapisecure}"
      traefik.tcp.routers.ots-marti-mtls.tls.passthrough: "true"
      traefik.tcp.routers.ots-marti-mtls.service: "ots-marti-mtls"
      traefik.tcp.services.ots-marti-mtls.loadbalancer.server.port: "8443"

      # ---------------------------------------------------------------
      # Certificate enrollment (dedicated Traefik entrypoint on :8446)
      #
      # Also passthrough: TAK clients enroll against the OTS CA certificate,
      # so nginx has to present its own certificate here, not a Let's Encrypt one.
      # ---------------------------------------------------------------
      traefik.tcp.routers.ots-enrollment.rule: "HostSNI(`${OTS_FQDN}`)"
      traefik.tcp.routers.ots-enrollment.entrypoints: "${TRAEFIK_ENROLLMENT_ENTRYPOINT:-takace}"
      traefik.tcp.routers.ots-enrollment.tls.passthrough: "true"
      traefik.tcp.routers.ots-enrollment.service: "ots-enrollment"
      traefik.tcp.services.ots-enrollment.loadbalancer.server.port: "8446"
  rabbitmq:
    build:
      context: .
      dockerfile: ots/configs/rabbitmq/Dockerfile
    image: ots-rabbitmq:local
    pull_policy: build
    container_name: ots-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    volumes:
      - "rabbitmq-data:/var/lib/rabbitmq"
    ports:
      - "127.0.0.1:1883:1883"   # MQTT (Meshtastic)
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 30s
      retries: 3
    networks: [ots]

  mediamtx:
    build:
      context: .
      dockerfile: ots/mediamtx/Dockerfile
    image: ots-mediamtx:local
    pull_policy: build
    container_name: ots-mediamtx
    hostname: mediamtx
    restart: unless-stopped
    ports:
      - "0.0.0.0:1935:1935"       # RTMP
      - "0.0.0.0:1936:1936"       # RTMPS
      - "0.0.0.0:8000:8000/udp"   # RTP
      - "0.0.0.0:8001:8001/udp"   # RTCP
      - "0.0.0.0:8189:8189/udp"   # WebRTC ICE
      - "0.0.0.0:8322:8322"       # RTSPS
      - "0.0.0.0:8554:8554"       # RTSP
      - "0.0.0.0:8888:8888"       # HLS
      - "0.0.0.0:8889:8889"       # WebRTC
      - "0.0.0.0:8890:8890/udp"   # SRT
      - "127.0.0.1:9997:9997"     # MediaMTX API
    volumes:
      - "ots-data:/app/ots"       # Recordings are stored in /app/ots/mediamtx/recordings.
    networks: [ots]

  ots-db:
    image: postgis/postgis:18-3.6
    container_name: ots-db
    hostname: ots-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      PGUSER: "${POSTGRES_USER}"
    volumes:
      - "pgdata:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ots]

networks:
  ots:
    name: ots

  traefik:
    external: true
    name: "${TRAEFIK_NETWORK:-traefik}"

volumes:
  ots-data:
  pgdata:
  rabbitmq-data:
